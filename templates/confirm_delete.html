{% extends "base.html" %}
{% block title %}Confirm delete{% endblock %}
{% block content %}
<div class="container py-5" style="max-width:560px">
  <div class="card p-4 text-center">
    <div class="stat-icon bg-rose-soft mx-auto mb-3"><i class="bi bi-trash3"></i></div>
    <h1 class="h4">Delete “{{ object }}”?</h1>
    <p class="text-muted">This action cannot be undone.</p>
    <form method="post" class="d-flex gap-2 justify-content-center">{% csrf_token %}
      <button class="btn btn-danger" type="submit">Yes, delete</button>
      <a href="{{ cancel_url }}" class="btn btn-soft">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
