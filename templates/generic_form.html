{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:820px">
  <div class="card p-4">
    <h1 class="h4 mb-4">{{ title }}</h1>
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <div class="d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save</button>
        {% if cancel_url %}<a class="btn btn-soft" href="{{ cancel_url }}">Cancel</a>{% endif %}</div>
    </form>
  </div>
</div>
{% endblock %}
